services:
  postgres:
    image: postgres:16-alpine
    container_name: orderprocessing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderprocessing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderprocessing}
      POSTGRES_DB: ${POSTGRES_DB:-orderprocessing}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderprocessing} -d ${POSTGRES_DB:-orderprocessing}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orderprocessing-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderprocessing-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orderprocessing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orderprocessing}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orderprocessing-network

networks:
  orderprocessing-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
