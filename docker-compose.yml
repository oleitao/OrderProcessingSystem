services:
  postgres:
    image: postgres:16-alpine
    container_name: orderprocessing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderprocessing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderprocessing}
      POSTGRES_DB: ${POSTGRES_DB:-orderprocessing}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderprocessing} -d ${POSTGRES_DB:-orderprocessing}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orderprocessing-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderprocessing-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orderprocessing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orderprocessing}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orderprocessing-network

  identity-service:
    build:
      context: .
      dockerfile: src/OrderProcessing.IdentityService/Dockerfile
    container_name: orderprocessing-identity-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # SQLite is its own, dedicated store — deliberately not sharing the "postgres" container
      # used by Orders (see .github/AGENT.md, section 2.1: Identity's data must stay decoupled).
      ConnectionStrings__IdentityDb: "Data Source=/app/data/identity.db"
      Jwt__Issuer: OrderProcessing.IdentityService
      Jwt__Audience: OrderProcessing.Api
    ports:
      - "8081:8080"
    volumes:
      - identity-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - orderprocessing-network

  order-api:
    build:
      context: .
      dockerfile: src/OrderProcessing.Api/Dockerfile
    container_name: orderprocessing-order-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Between containers, use service names (postgres/rabbitmq/identity-service) — never localhost.
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderprocessing};Username=${POSTGRES_USER:-orderprocessing};Password=${POSTGRES_PASSWORD:-orderprocessing}"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: ${RABBITMQ_USER:-orderprocessing}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-orderprocessing}
      Jwt__Issuer: OrderProcessing.IdentityService
      Jwt__Audience: OrderProcessing.Api
      Jwt__JwksUri: "http://identity-service:8080/.well-known/jwks.json"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - orderprocessing-network

  order-worker:
    build:
      context: .
      dockerfile: src/OrderProcessing.OrderWorker/Dockerfile
    container_name: orderprocessing-order-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      # Between containers, use service names (postgres/rabbitmq) — never localhost.
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderprocessing};Username=${POSTGRES_USER:-orderprocessing};Password=${POSTGRES_PASSWORD:-orderprocessing}"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: ${RABBITMQ_USER:-orderprocessing}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-orderprocessing}
      OrderProcessing__FailureProbability: ${ORDER_WORKER_FAILURE_PROBABILITY:-0.0}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # order-api applies EF Core migrations before it starts listening (see its Program.cs), so
      # its health check can't pass until the schema exists — waiting on it here means order-worker
      # never queries tables that aren't there yet.
      order-api:
        condition: service_healthy
    networks:
      - orderprocessing-network

networks:
  orderprocessing-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  identity-data:
